name = "clubmed-offers"
main = "offers-worker.js"
compatibility_date = "2026-07-21"

# L'app elle-même, servie par le worker : même origine que les données, donc
# plus aucune requête cross-origine. .assetsignore à la racine ne laisse monter
# que index.html (surtout pas OFFERS.xlsx ni .git).
[assets]
directory = "../"

# Le classeur du jour + l'archive datée (14 jours glissants)
[[r2_buckets]]
binding = "OFFERS"
bucket_name = "clubmed-offers"

# Qui ouvre l'outil et ce qu'il cherche
[[d1_databases]]
binding = "USAGE"
database_name = "clubmed-usage"
database_id = "6b7d292b-3d37-4177-92cf-db3df736c00d"

[vars]
# Vide = tout expéditeur accepté. Renseigner l'adresse exacte de l'expéditeur
# du mail quotidien, ou "@domaine.com" pour tout un domaine. Plusieurs valeurs
# séparées par des virgules.
ALLOWED_SENDERS = "@clubmed.com"
